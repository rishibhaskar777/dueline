<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
<title id="t">Dueline architecture</title>
<desc id="d">The freelancer uses Dueline in the browser. Dueline runs on Vercel as a Next.js app with API routes, checks in code and a daily job. It creates, sends and reminds invoices through PayPal Invoicing v2 in the sandbox, reads the real fee and net from PayPal transactions, and receives verified PayPal webhooks when a client pays. It sends chats with emails and phone numbers masked to Google Gemini to draft invoices and reminders, stores data in Neon Postgres, and reads European Central Bank rates through Frankfurter. A Vercel cron runs the daily job at 06:00 India time. The animation follows one invoice in eight steps: the freelancer pastes a chat, the masked chat goes to Gemini, the draft is checked in code, Dueline creates and sends the PayPal invoice, the client pays on PayPal, a verified webhook arrives, Transaction Search returns the real fee and net, and Home shows the rupees that reached the bank.</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .t{font-size:19px;font-weight:800;fill:#0b0b0f;letter-spacing:-0.3px}
  .s{font-size:13.5px;fill:#4c5260}
  .tw{font-size:19px;font-weight:800;fill:#ffffff;letter-spacing:-0.3px}
  .sw{font-size:13.5px;fill:#cfdcff}
  .lab{font-size:12.5px;font-weight:700;fill:#0a2a7a}
  .flow{fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:2 12;animation:flow 1.4s linear infinite}
  .rev{animation-direction:reverse}
  .slow{animation-duration:2.4s}
  .rail{fill:none;stroke-width:3;stroke-opacity:.18}
  .pulse{animation:pulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes flow{to{stroke-dashoffset:-28}}
  @keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.9;transform:scale(1.35)}}
  @media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}.mover,.hl,.prog{display:none}.cap{opacity:0}}
</style>
