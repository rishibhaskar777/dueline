<text x="48" y="58" font-size="15" font-weight="800" fill="#0a2a7a" letter-spacing="1">HOW A PAYMENT FLOWS THROUGH DUELINE</text>
<text x="760" y="58" class="s" text-anchor="start">One invoice, from chat to rupees. Runs on the PayPal sandbox.</text>

