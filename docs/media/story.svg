<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
<title id="t">Dueline in 30 seconds</title>
<desc id="d">An animated story. Riya, a freelance designer in Pune, is paid by clients abroad through PayPal. She copies chats into invoices by hand, cannot tell how many rupees will arrive, avoids chasing a client who is 8 days late, and her CA asks for FIRA and FIRC papers. Her friend Arjun suggests Dueline. Dueline drafts the PayPal invoice from the chat, shows the rupees that reach her bank, spots the late payer and drafts a firm reminder, and keeps a monthly export register for her CA. Get paid from abroad. Without chasing.</desc>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
  text:not([fill]):not(.w):not(.m){fill:#0b0b0f}
  .h{font-weight:800;letter-spacing:-0.5px}
  .m{fill:#4c5260}
  .w{fill:#ffffff}
  .a{animation-duration:28s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
  .s1{animation-name:s1}.s2{animation-name:s2}.s3{animation-name:s3}.s4{animation-name:s4}
  .rv{animation-name:rv}.b1{animation-name:b1}.b2{animation-name:b2}.b3{animation-name:b3}.b4{animation-name:b4}
  .c1{animation-name:c1}.c2{animation-name:c2}.c3{animation-name:c3}.c4{animation-name:c4}
  .sad{animation-name:sad}.happy{animation-name:happy}.dot{animation-name:dot}
  .fill{animation-name:fill;transform-box:fill-box;transform-origin:left center}
  .float{animation:float 4s ease-in-out infinite;transform-box:fill-box}
  @keyframes rv{0%,78%{opacity:1}82%,100%{opacity:0}}
  @keyframes s1{0%,1%{opacity:0}3%,22%{opacity:1}25%,100%{opacity:0}}
  @keyframes b1{0%,3%{opacity:0;transform:translateY(10px)}5%,22%{opacity:1;transform:none}25%,100%{opacity:0}}
  @keyframes b2{0%,7%{opacity:0;transform:translateY(10px)}9%,22%{opacity:1;transform:none}25%,100%{opacity:0}}
  @keyframes b3{0%,11%{opacity:0;transform:translateY(10px)}13%,22%{opacity:1;transform:none}25%,100%{opacity:0}}
  @keyframes b4{0%,15%{opacity:0;transform:translateY(10px)}17%,22%{opacity:1;transform:none}25%,100%{opacity:0}}
  @keyframes s2{0%,24%{opacity:0;transform:translateX(40px)}27%,36%{opacity:1;transform:none}39%,100%{opacity:0;transform:none}}
  @keyframes s3{0%,37%{opacity:0}40%,78%{opacity:1}82%,100%{opacity:0}}
  @keyframes c1{0%,40%{opacity:0;transform:translateY(12px)}43%,78%{opacity:1;transform:none}82%,100%{opacity:0}}
  @keyframes c2{0%,49%{opacity:0;transform:translateY(12px)}52%,78%{opacity:1;transform:none}82%,100%{opacity:0}}
  @keyframes c3{0%,58%{opacity:0;transform:translateY(12px)}61%,78%{opacity:1;transform:none}82%,100%{opacity:0}}
  @keyframes c4{0%,67%{opacity:0;transform:translateY(12px)}70%,78%{opacity:1;transform:none}82%,100%{opacity:0}}
  @keyframes fill{0%,52%{transform:scaleX(0)}58%,100%{transform:scaleX(1)}}
  @keyframes s4{0%,80%{opacity:0}84%,98%{opacity:1}100%{opacity:0}}
  @keyframes sad{0%,39%{opacity:1}41%,100%{opacity:0}}
  @keyframes happy{0%,39%{opacity:0}41%,100%{opacity:1}}
  @keyframes dot{0%,1%{opacity:0}2%,24%{opacity:1}25%,39%{opacity:.35}40%,80%{opacity:1}82%,100%{opacity:0}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @media (prefers-reduced-motion:reduce){
    .a,.float{animation:none}
    .s1,.s2,.s4,.b1,.b2,.b3,.b4,.sad{opacity:0}
    .s3,.c1,.c2,.c3,.c4,.happy,.rv{opacity:1}
  }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf1ff"/><stop offset="1" stop-color="#f6f8fd"/></linearGradient>
  <radialGradient id="glow" cx="0.2" cy="0" r="0.8"><stop offset="0" stop-color="#9cc0ff" stop-opacity=".55"/><stop offset="1" stop-color="#9cc0ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a2a7a"/><stop offset="1" stop-color="#06184d"/></linearGradient>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0a1e50" flood-opacity=".12"/></filter>
</defs>

<rect width="1280" height="640" rx="28" fill="url(#bg)"/>
<rect width="1280" height="640" rx="28" fill="url(#glow)"/>

<!-- progress dots -->
<g transform="translate(1110 44)">
  <circle class="a dot" r="5" cx="0" cy="0" fill="#0a2a7a"/>
  <circle r="5" cx="20" cy="0" fill="#0a2a7a" opacity=".25"/>
  <circle r="5" cx="40" cy="0" fill="#0a2a7a" opacity=".25"/>
  <text x="60" y="5" font-size="14" font-weight="700" class="m">Dueline</text>
</g>

<!-- RIYA, stays on the left for scenes 1 to 3 -->
<g class="a rv">
  <text x="70" y="70" font-size="15" font-weight="700" class="m">MEET RIYA</text>
  <text x="70" y="98" font-size="24" class="h">Freelance designer, Pune</text>
  <text x="70" y="124" font-size="16" class="m">Clients in the US, UK and Portugal pay her through PayPal.</text>
  <!-- desk -->
  <rect x="70" y="470" width="400" height="16" rx="8" fill="#c9d4ea"/>
  <rect x="96" y="486" width="12" height="96" fill="#c9d4ea"/>
  <rect x="432" y="486" width="12" height="96" fill="#c9d4ea"/>
  <!-- chair -->
  <rect x="150" y="410" width="120" height="16" rx="8" fill="#8fa3c8"/>
  <rect x="160" y="300" width="18" height="120" rx="9" fill="#8fa3c8"/>
  <!-- body -->
  <path d="M190 470 C188 400 200 352 236 340 C272 352 284 400 282 470 Z" fill="#1f8a8a"/>
  <path d="M236 344 L224 362 L236 380 L248 362 Z" fill="#17706f"/>
  <!-- arm to laptop -->
  <path d="M268 380 C300 400 320 430 342 452" stroke="#1f8a8a" stroke-width="22" stroke-linecap="round" fill="none"/>
  <circle cx="346" cy="456" r="11" fill="#c58c64"/>
  <!-- head -->
  <rect x="226" y="316" width="20" height="26" rx="8" fill="#c58c64"/>
  <circle cx="236" cy="290" r="38" fill="#c58c64"/>
  <path d="M198 292 C196 250 226 238 248 242 C270 246 280 266 276 290 C266 270 246 262 226 268 C214 272 204 282 198 292 Z" fill="#2b1d16"/>
  <circle cx="276" cy="262" r="16" fill="#2b1d16"/>
  <circle cx="250" cy="292" r="3.4" fill="#2b1d16"/>
  <circle cx="226" cy="292" r="3.4" fill="#2b1d16"/>
  <path class="a sad" d="M226 312 Q238 304 250 312" stroke="#2b1d16" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path class="a happy" d="M224 308 Q238 322 252 308" stroke="#2b1d16" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- laptop -->
  <path d="M330 468 L470 468 L452 380 L348 380 Z" fill="#26324a"/>
  <rect x="318" y="464" width="164" height="8" rx="4" fill="#3a4766"/>
  <circle cx="400" cy="422" r="10" fill="#4b6fd6" opacity=".9"/>
  <!-- tea -->
  <rect x="112" y="440" width="26" height="30" rx="6" fill="#ffffff" stroke="#c9d4ea" stroke-width="2"/>
  <path d="M138 448 q10 0 10 10 q0 8 -10 8" stroke="#c9d4ea" stroke-width="3" fill="none"/>
</g>

<!-- SCENE 1: the problems -->
<g class="a s1">
  <text x="600" y="98" font-size="15" font-weight="700" fill="#b3241c">EVERY MONTH</text>
</g>
<g class="a b1" filter="url(#sh)">
  <rect x="600" y="130" width="600" height="80" rx="20" fill="#ffffff"/>
  <text x="628" y="164" font-size="20" font-weight="700">Copying a WhatsApp chat into an invoice. Again.</text>
  <text x="628" y="190" font-size="15" class="m">Items, quantities, prices, due date, all typed by hand.</text>
</g>
<g class="a b2" filter="url(#sh)">
  <rect x="600" y="226" width="600" height="80" rx="20" fill="#ffffff"/>
  <text x="628" y="260" font-size="20" font-weight="700">$900 invoiced. How many rupees will arrive?</text>
  <text x="628" y="286" font-size="15" class="m">PayPal's fee and conversion take a share she only sees later.</text>
</g>
<g class="a b3" filter="url(#sh)">
  <rect x="600" y="322" width="600" height="80" rx="20" fill="#fdecea"/>
  <text x="628" y="356" font-size="20" font-weight="700" fill="#b3241c">A client is 8 days late. Chasing feels awkward.</text>
  <text x="628" y="382" font-size="15" class="m">So she waits, and waits.</text>
</g>
<g class="a b4" filter="url(#sh)">
  <rect x="600" y="418" width="600" height="80" rx="20" fill="#fff4e0"/>
  <text x="628" y="452" font-size="20" font-weight="700" fill="#8a4f00">Her CA asks for FIRA, FIRC and purpose codes.</text>
  <text x="628" y="478" font-size="15" class="m">Export paperwork, rebuilt from emails every month.</text>
</g>

<!-- SCENE 2: the friend -->
<g class="a s2">
  <g class="float">
    <rect x="600" y="170" width="430" height="128" rx="24" fill="#ffffff" filter="url(#sh)"/>
    <path d="M980 298 L1000 330 L1010 298 Z" fill="#ffffff"/>
    <text x="630" y="214" font-size="15" font-weight="700" class="m">ARJUN, A FRIEND WHO FREELANCES TOO</text>
    <text x="630" y="250" font-size="26" class="h">"Try Dueline."</text>
    <text x="630" y="280" font-size="17" class="m">It runs on PayPal and does the boring parts.</text>
  </g>
  <!-- Arjun -->
  <path d="M1010 600 C1008 520 1020 470 1060 456 C1100 470 1112 520 1110 600 Z" fill="#f08a4b"/>
  <rect x="1050" y="430" width="20" height="28" rx="8" fill="#8d5a3b"/>
  <circle cx="1060" cy="404" r="38" fill="#8d5a3b"/>
  <path d="M1022 398 C1022 362 1046 354 1064 356 C1088 358 1100 376 1098 398 C1088 382 1070 376 1052 380 C1038 384 1028 390 1022 398 Z" fill="#1d1410"/>
  <circle cx="1046" cy="406" r="3.4" fill="#1d1410"/>
  <circle cx="1072" cy="406" r="3.4" fill="#1d1410"/>
  <path d="M1046 422 Q1060 434 1074 422" stroke="#1d1410" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M1100 486 C1130 470 1146 440 1150 410" stroke="#f08a4b" stroke-width="22" stroke-linecap="round" fill="none"/>
  <circle cx="1152" cy="404" r="12" fill="#8d5a3b"/>
</g>

<!-- SCENE 3: Dueline -->
<g class="a s3">
  <rect x="580" y="70" width="640" height="510" rx="28" fill="url(#navy)" filter="url(#sh)"/>
  <rect x="610" y="100" width="34" height="34" rx="10" fill="#ffffff"/>
  <path d="M617 121 h15" stroke="#1d63f0" stroke-width="3" stroke-linecap="round"/>
  <circle cx="636" cy="121" r="3.5" fill="#0a2a7a"/>
  <path d="M636 108 v6" stroke="#0a2a7a" stroke-width="2.4" stroke-linecap="round"/>
  <text x="656" y="125" font-size="22" class="h w">Dueline</text>
  <text x="1190" y="125" font-size="14" text-anchor="end" fill="#bcd3ff">PayPal Invoicing + Gemini</text>
</g>
<g class="a c1">
  <rect x="610" y="152" width="580" height="92" rx="18" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".18"/>
  <text x="634" y="182" font-size="13" font-weight="700" fill="#9cc4ff">1  PASTE THE CHAT</text>
  <text x="634" y="210" font-size="19" font-weight="700" class="w">Invoice drafted: pitch deck design, $900</text>
  <text x="634" y="232" font-size="14" fill="#d0dcff">Every line quotes the chat. Nothing is sent until she clicks.</text>
</g>
<g class="a c2">
  <rect x="610" y="256" width="580" height="92" rx="18" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".18"/>
  <text x="634" y="286" font-size="13" font-weight="700" fill="#9cc4ff">2  KNOW YOUR RUPEES</text>
  <text x="634" y="316" font-size="19" font-weight="700" class="w">$900 → about ₹79,221 reaches her bank</text>
  <rect x="1046" y="304" width="120" height="10" rx="5" fill="#ffffff" fill-opacity=".15"/>
  <rect class="a fill" x="1046" y="304" width="120" height="10" rx="5" fill="#7cc8ff"/>
  <text x="634" y="336" font-size="14" fill="#d0dcff">PayPal's fee and conversion shown before she sends.</text>
</g>
<g class="a c3">
  <rect x="610" y="360" width="580" height="92" rx="18" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".18"/>
  <text x="634" y="390" font-size="13" font-weight="700" fill="#ffb4ab">3  SPOT LATE PAYERS</text>
  <text x="634" y="418" font-size="19" font-weight="700" class="w">Late on 3 of 3 invoices. Firm reminder ready.</text>
  <rect x="1066" y="396" width="100" height="30" rx="15" fill="#ff8a80"/>
  <text x="1116" y="416" font-size="13" font-weight="800" text-anchor="middle" fill="#3a0d09">Review</text>
  <text x="634" y="440" font-size="14" fill="#d0dcff">She reads it, then PayPal sends it. Or her own email does.</text>
</g>
<g class="a c4">
  <rect x="610" y="464" width="580" height="92" rx="18" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".18"/>
  <text x="634" y="494" font-size="13" font-weight="700" fill="#9ff0c4">4  STAY EXPORT-READY</text>
  <text x="634" y="522" font-size="19" font-weight="700" class="w">October register for her CA, matched to FIRA</text>
  <text x="634" y="544" font-size="14" fill="#d0dcff">Purpose codes, LUT, GSTR-1 rows and bank FIRC numbers.</text>
  <circle cx="1150" cy="510" r="16" fill="#34c27a"/>
  <path d="M1142 510 l6 6 l11 -12" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<!-- SCENE 4: tagline -->
<g class="a s4">
  <rect width="1280" height="640" rx="28" fill="url(#navy)"/>
  <rect x="560" y="150" width="160" height="160" rx="44" fill="#ffffff"/>
  <path d="M592 252 h70" stroke="#1d63f0" stroke-width="13" stroke-linecap="round"/>
  <circle cx="682" cy="252" r="15" fill="#0a2a7a"/>
  <path d="M682 196 v26" stroke="#0a2a7a" stroke-width="11" stroke-linecap="round"/>
  <text x="640" y="392" font-size="56" text-anchor="middle" class="h w">Get paid from abroad.</text>
  <text x="640" y="456" font-size="56" text-anchor="middle" class="h w">Without chasing.</text>
  <text x="640" y="512" font-size="20" text-anchor="middle" fill="#bcd3ff">Dueline · for freelancers in India paid through PayPal</text>
</g>
</svg>
